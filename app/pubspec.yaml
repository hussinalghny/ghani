name: ghani_academy
description: تطبيق غني أكاديمي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.0
  video_player: ^2.9.2
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.1.0
  android_id: ^0.4.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/img/
  # ملفات خط ثمانية تنزل وقت البناء من الرابط الرسمي (tool/fonts.sh) وما تنرفع للمستودع
  fonts:
    - family: ThmanyahSans
      fonts:
        - asset: assets/fonts/thmanyahsans-Regular.otf
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahsans-Black.otf
          weight: 900
    - family: ThmanyahSerif
      fonts:
        - asset: assets/fonts/thmanyahserifdisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahserifdisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahserifdisplay-Black.otf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/img/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#1B1446"
  adaptive_icon_foreground: assets/img/icon_fg.png
