name: ghani_academy
description: تطبيق غني أكاديمي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.1.0
  android_id: ^0.4.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/img/app_icon.png
  remove_alpha_ios: true
