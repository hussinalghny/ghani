name: Ghani Pay (Android listener)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['payapp/**', '.github/workflows/payapp.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: payapp
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GhaniPay.apk
          cp GhaniPay.apk GhaniPay-v${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: payapp-v${{ github.run_number }}
          name: غني باي ${{ github.run_number }}
          body: تطبيق قراءة إشعارات الاستلام للدفع المباشر. ينصب على موبايل أندرويد عليه تطبيق المحفظة.
          make_latest: false
          files: |
            payapp/GhaniPay*.apk
