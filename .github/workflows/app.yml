name: App APK + IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']

env:
  # غير الدومين من Settings > Secrets and variables > Actions > Variables باسم API_BASE
  API_BASE: ${{ vars.API_BASE || 'https://poised-chocolate-shark-35.hostingersite.com' }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      # توقيع ثابت: كل نسخة جديدة تتنصب فوق القديمة بدون حذف
      - run: mkdir -p ~/.android && cp tool/debug.keystore ~/.android/debug.keystore
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=API_BASE=$API_BASE
      - name: Verify icons font is bundled
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E "CupertinoIcons|MaterialIcons" 
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q "CupertinoIcons" || { echo "CupertinoIcons font missing"; exit 1; }
      - run: cp build/app/outputs/flutter-apk/app-release.apk ghani-academy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ghani-academy-apk
          path: app/ghani-academy.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare.sh
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=API_BASE=$API_BASE
      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ghani-academy.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ghani-academy-ipa
          path: app/ghani-academy.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: تطبيق غني أكاديمي ${{ github.run_number }}
          body: |
            المنصة: ${{ env.API_BASE }}
            Android: ghani-academy.apk
            iPhone (غير موقع، يتنصب عبر ESign/Sideloadly): ghani-academy.ipa
          make_latest: true
          files: |
            ghani-academy.apk
            ghani-academy.ipa
