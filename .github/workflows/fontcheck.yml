name: font check
on:
  push:
    paths: ['.github/workflows/fontcheck.yml']
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o f.zip https://public-assets.thmanyah.com/font/Thmanyah-Font-Family.zip
          ls -la f.zip; unzip -l f.zip
          unzip -q f.zip -d f && pip install -q fonttools brotli >/dev/null
          for x in $(find f -iname '*.otf' | head -40); do python -c "import sys;from fontTools.ttLib import TTFont;t=TTFont(sys.argv[1]);n=t['name'];print(sys.argv[1], '|', n.getDebugName(1), '|', n.getDebugName(2), '|', t['OS/2'].usWeightClass)" "$x"; done
