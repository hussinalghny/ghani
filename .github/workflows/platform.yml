name: Platform ready ZIP (with vendor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/platform.yml']

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, fileinfo
      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --prefer-dist
      - name: Smoke test (sqlite)
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/; /^DB_DATABASE=/d; s/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=false/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --seed --force
          php artisan route:list --except-vendor | tail -5
          php artisan view:cache
          php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          sleep 3
          fail=0
          for u in / /courses /course/smart-defense /login /register /app /install.php /api/v1/config /api/v1/home /api/v1/courses /api/v1/courses/smart-defense; do
            c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' "http://127.0.0.1:8000$u"); echo "$c $u"
            if [ "$c" -ge 500 ]; then fail=1; grep -o '"message":"[^"]*"' /tmp/out | head -2; head -c 600 /tmp/out; fi
          done
          T=$(curl -s -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' http://127.0.0.1:8000/api/v1/auth/register \
            -d '{"name":"طالب تجربة","phone":"07701234567","password":"12345678","device_id":"ci-device-1","platform":"android"}' | php -r 'echo json_decode(stream_get_contents(STDIN))->token ?? "";')
          echo "token: ${T:0:6}..."
          [ -n "$T" ] || fail=1
          for u in /me /me/courses /wallet /me/devices; do
            c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $T" "http://127.0.0.1:8000/api/v1$u"); echo "$c $u"
            [ "$c" -lt 400 ] || { fail=1; head -c 600 /tmp/out; }
          done
          c=$(curl -s -o /tmp/out -w '%{http_code}' -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $T" -d '{"code":"AAAA-BBBB-CCCC"}' http://127.0.0.1:8000/api/v1/wallet/redeem); echo "$c redeem(invalid) $(cat /tmp/out)"
          [ "$c" = "422" ] || fail=1
          # المحادثة مع الدعم
          C=$(curl -s -X POST -H 'Accept: application/json' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/chats/support | php -r 'echo json_decode(stream_get_contents(STDIN))->data->id ?? "";')
          echo "support chat: $C"; [ -n "$C" ] || fail=1
          c=$(curl -s -o /tmp/out -w '%{http_code}' -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $T" -d '{"body":"مرحبا"}' http://127.0.0.1:8000/api/v1/chats/$C/messages); echo "$c send"; [ "$c" = "201" ] || { fail=1; cat /tmp/out; }
          c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $T" "http://127.0.0.1:8000/api/v1/chats/$C/messages?after=0"); echo "$c messages $(head -c 200 /tmp/out)"; [ "$c" = "200" ] || fail=1
          c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/chats); echo "$c chats"; [ "$c" = "200" ] || fail=1
          # فيديو محلي: درس معاينة مجاني برابط موقع ويدعم Range
          mkdir -p storage/app/private/videos/2026-11 && head -c 300000 /dev/urandom > storage/app/private/videos/2026-11/test.mp4
          php artisan tinker --execute='App\Models\Lesson::where("is_free_preview",1)->first()->update(["video_path"=>"videos/2026-11/test.mp4"]);'
          php artisan tinker --execute='App\Models\Setting::put(["video_web"=>1,"video_app"=>1,"video_desktop"=>1]);'
          L=$(php artisan tinker --execute='echo App\Models\Lesson::where("is_free_preview",1)->first()->id;' | tail -1)
          V=$(curl -s -H 'Accept: application/json' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/lessons/$L | php -r '$d=json_decode(stream_get_contents(STDIN)); echo $d->data->playback->video_url ?? "";')
          echo "video url: $V"; [ -n "$V" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1023' -H "Authorization: Bearer $T" -H 'Accept: application/json' "$V"); echo "$c app video range (with token)"; [ "$c" = "206" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' "$V"); echo "$c app video without token"; [ "$c" = "401" ] || fail=1
          D=$(curl -s -H 'Accept: application/json' -H 'X-Client: desktop' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/lessons/$L | php -r '$d=json_decode(stream_get_contents(STDIN)); echo $d->data->playback->video_url ?? "";')
          echo "desktop url: ${D:0:80}"
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1023' "$D"); echo "$c desktop video (no headers)"; [ "$c" = "206" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' "$D"); echo "$c desktop video in browser"; [ "$c" = "403" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' "${D%&signature=*}&signature=x"); echo "$c desktop video tampered"; [ "$c" = "403" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $T" -d '{"token":"ci-fcm-token","platform":"android"}' http://127.0.0.1:8000/api/v1/me/push-token); echo "$c push token"; [ "$c" = "200" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/privacy); echo "$c privacy"; [ "$c" = "200" ] || fail=1
          # صفحات الويب بعد تسجيل الدخول كأدمن
          J=/tmp/jar; rm -f $J
          TOK=$(curl -s -c $J -b $J http://127.0.0.1:8000/login | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          curl -s -o /dev/null -c $J -b $J -X POST -d "_token=$TOK&phone=07766637444&password=ChangeMe@2026" http://127.0.0.1:8000/login
          # فيديو الموقع: الرابط من طلب منفصل ومربوط بالجلسة
          SRC=$(curl -s -c $J -b $J http://127.0.0.1:8000/learn/smart-defense > /tmp/learn.html; X=$(grep -o 'name="csrf-token" content="[^"]*"' /tmp/learn.html | sed 's/.*content="//;s/"//'); curl -s -c $J -b $J -X POST -H "X-CSRF-TOKEN: $X" -H 'Accept: application/json' http://127.0.0.1:8000/learn/lesson/$L/source | php -r 'echo json_decode(stream_get_contents(STDIN))->src ?? "";')
          echo "web src: ${SRC:0:70}..."; [ -n "$SRC" ] || fail=1
          grep -q "videos/2026-11" /tmp/learn.html && { echo "video path leaked in HTML"; fail=1; }
          c=$(curl -s -o /dev/null -w '%{http_code}' -c $J -b $J -H 'Range: bytes=0-100' -H 'Sec-Fetch-Dest: video' "$SRC"); echo "$c web video same session"; [ "$c" = "206" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-100' "$SRC"); echo "$c web video other browser"; [ "$c" -ge 300 ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -c $J -b $J -H 'Sec-Fetch-Dest: document' "$SRC"); echo "$c web video opened as page"; [ "$c" = "403" ] || fail=1
          for u in /admin/notifications /admin /admin/courses /admin/courses/smart-defense/curriculum /admin/courses/smart-defense/lessons/create /admin/lessons/1/edit /admin/categories /admin/instructors /admin/instructors/1/edit /admin/vouchers /admin/vouchers/create /admin/students /admin/settings /admin/app /teach /teach?instructor=1 /admin/courses/smart-defense/edit /inbox /messages /messages/support /account /wallet /learn/smart-defense /certificates /account/settings; do
            c=$(curl -s -o /tmp/out -L -w '%{http_code}' -c $J -b $J "http://127.0.0.1:8000$u"); echo "$c $u"
            if [ "$c" -ge 400 ]; then fail=1; grep -o '<title>[^<]*' /tmp/out | head -1; grep -o 'class="exception-message[^<]*<[^<]*' /tmp/out | head -2; fi
          done
          # لوحة المدرب: يشوف كورساته فقط ويعدلها بدون السعر
          php artisan tinker --execute='$u=new App\Models\User; $u->forceFill(["name"=>"مدرب","phone"=>"07700000009","password"=>Illuminate\Support\Facades\Hash::make("Teach@2026"),"role"=>"instructor"])->save(); App\Models\Instructor::first()->update(["user_id"=>$u->id,"commission_percent"=>40]); $c=App\Models\Course::first()->replicate(); $c->slug="not-mine"; $c->instructor_id=null; $c->save();'
          I=/tmp/teach.jar
          TOK=$(curl -s -c $I -b $I http://127.0.0.1:8000/login | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          curl -s -o /dev/null -c $I -b $I -X POST -d "_token=$TOK&phone=07700000009&password=Teach@2026" http://127.0.0.1:8000/login
          c=$(curl -s -o /tmp/out -w '%{http_code}' -c $I -b $I http://127.0.0.1:8000/teach); echo "$c teach (instructor)"; [ "$c" = "200" ] && grep -q 'حاسبة الأرباح' /tmp/out && grep -q '40%' /tmp/out || { fail=1; grep -o 'class="exception-message[^<]*<[^<]*' /tmp/out | head -2; }
          for u in /admin/courses/smart-defense/edit /admin/courses/smart-defense/curriculum /admin/lessons/1/edit; do c=$(curl -s -o /dev/null -w '%{http_code}' -c $I -b $I "http://127.0.0.1:8000$u"); echo "$c $u (instructor)"; [ "$c" = "200" ] || fail=1; done
          for u in /admin /admin/courses /admin/courses/not-mine/edit /admin/students; do c=$(curl -s -o /dev/null -w '%{http_code}' -c $I -b $I "http://127.0.0.1:8000$u"); echo "$c $u (instructor, must be 403)"; [ "$c" = "403" ] || fail=1; done
          X=$(curl -s -c $I -b $I http://127.0.0.1:8000/admin/courses/smart-defense/edit | grep -o 'name="csrf-token" content="[^"]*"' | sed 's/.*content="//;s/"//')
          P0=$(php artisan tinker --execute='echo App\Models\Course::where("slug","smart-defense")->value("price");' | tail -1)
          c=$(curl -s -o /dev/null -w '%{http_code}' -c $I -b $I -X POST -d "_token=$X&_method=PUT&title=عنوان جديد&level=beginner&price=1&category_id=1&is_published=1" http://127.0.0.1:8000/admin/courses/smart-defense); echo "$c instructor update"
          R=$(php artisan tinker --execute='$c=App\Models\Course::where("slug","smart-defense")->first(); echo $c->title."|".$c->price;' | tail -1); echo "after update: $R (price before $P0)"
          [ "$c" = "302" ] && [ "$R" = "عنوان جديد|$P0" ] || fail=1
          # التشغيل من تطبيق الكمبيوتر فقط (الافتراضي)
          php artisan tinker --execute='App\Models\Setting::put(["video_web"=>0,"video_app"=>0,"video_desktop"=>1]);'
          P=$(curl -s -H 'Accept: application/json' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/lessons/$L | php -r '$d=json_decode(stream_get_contents(STDIN)); echo $d->data->playback->provider ?? "";'); echo "mobile provider: $P"; [ "$P" = "blocked" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-100' -H "Authorization: Bearer $T" -H 'Accept: application/json' "$V"); echo "$c mobile stream locked"; [ "$c" = "403" ] || fail=1
          D=$(curl -s -H 'Accept: application/json' -H 'X-Client: desktop' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/lessons/$L | php -r '$d=json_decode(stream_get_contents(STDIN)); echo $d->data->playback->video_url ?? "";')
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-100' "$D"); echo "$c desktop still works"; [ "$c" = "206" ] || fail=1
          c=$(curl -s -o /tmp/out -w '%{http_code}' -c $J -b $J http://127.0.0.1:8000/learn/smart-defense); echo "$c web lesson page locked"; grep -q 'تطبيق الكمبيوتر' /tmp/out || fail=1
          # الدفع المباشر: طلب بمبلغ مميز + إشعار موقع من غني باي = تفعيل تلقائي
          php artisan tinker --execute='App\Models\Setting::put(["pay_enabled"=>1,"pay_qi_number"=>"07700000000","pay_qi_name"=>"غني أكاديمي","pay_hook_secret"=>"ci-secret-123"]);'
          X=$(curl -s -c $J -b $J http://127.0.0.1:8000/wallet | grep -o 'name="csrf-token" content="[^"]*"' | sed 's/.*content="//;s/"//')
          c=$(curl -s -o /dev/null -w '%{http_code}' -c $J -b $J -X POST -d "_token=$X&method=qi&amount=50000" http://127.0.0.1:8000/pay); echo "$c create order"; [ "$c" = "302" ] || fail=1
          OID=$(php artisan tinker --execute='echo App\Models\PaymentOrder::latest("id")->value("id");' | tail -1)
          AMT=$(php artisan tinker --execute='echo App\Models\PaymentOrder::latest("id")->value("amount");' | tail -1)
          B0=$(php artisan tinker --execute='echo App\Models\PaymentOrder::find('$OID')->user->balance;' | tail -1)
          c=$(curl -s -o /tmp/out -w '%{http_code}' -c $J -b $J http://127.0.0.1:8000/pay/$OID); echo "$c pay page amount=$AMT"; [ "$c" = "200" ] && grep -q "$(php -r "echo number_format($AMT);")" /tmp/out || { fail=1; grep -o 'class="exception-message[^<]*<[^<]*' /tmp/out | head -2; }
          hook() { local body="$1" sec="${2:-ci-secret-123}" ts=$(date +%s); local sig=$(printf '%s' "$ts.$body" | openssl dgst -sha256 -hmac "$sec" | sed 's/.*= //'); curl -s -o /tmp/hook -w '%{http_code}' -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -H "X-Ghani-Time: $ts" -H "X-Ghani-Sign: $sig" --data "$body" http://127.0.0.1:8000/api/v1/payments/hook; }
          FMT=$(php -r "echo number_format($AMT);")
          c=$(hook '{"text":"تم استلام مبلغ IQD '$FMT'.00 إلى حسابك","source":"notification"}' wrong-secret); echo "$c hook bad signature"; [ "$c" = "401" ] || fail=1
          c=$(hook '{"title":"حركة ناجحة","text":"نجحت بإرسال '$FMT' دينار عراقي إلى حسابك.","package":"iq.qi","posted_at":1795200000000}'); echo "$c hook outgoing $(cat /tmp/hook)"; grep -q '"ignored"' /tmp/hook || fail=1
          BODY='{"title":"Notification","text":"تم استلام مبلغ IQD '$FMT'.00 إلى حسابك بتاريخ '$(TZ=Asia/Baghdad date +%d/%m/%y\ %H:%M:%S)' عن طريق SuperQi. رصيد حسابك الحالي 1,094,319","package":"iq.qi","posted_at":'$(date +%s)'000}'
          c=$(hook "$BODY"); echo "$c hook incoming $(cat /tmp/hook)"; grep -q '"matched"' /tmp/hook || fail=1
          c=$(hook "$BODY"); echo "$c hook duplicate $(cat /tmp/hook)"
          R=$(php artisan tinker --execute='$o=App\Models\PaymentOrder::find('$OID'); echo $o->status."|".$o->paid_by."|".$o->user->balance;' | tail -1); echo "order after: $R (balance before $B0)"
          [ "$R" = "paid|auto|$((B0 + AMT))" ] || fail=1
          for u in /admin/payments "/admin/payments?status=paid" /wallet /course/smart-defense; do c=$(curl -s -o /tmp/out -w '%{http_code}' -c $J -b $J "http://127.0.0.1:8000$u"); echo "$c $u"; [ "$c" = "200" ] || { fail=1; grep -o 'class="exception-message[^<]*<[^<]*' /tmp/out | head -2; }; done
          # لوحة غني باي: الطلبات والتأكيد اليدوي بنفس التوقيع
          sreq() { local m="$1" p="$2" body="${3:-}" ts=$(date +%s); local sig=$(printf '%s' "$ts.$body" | openssl dgst -sha256 -hmac ci-secret-123 | sed 's/.*= //'); curl -s -o /tmp/con -w '%{http_code}' -X "$m" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "X-Ghani-Time: $ts" -H "X-Ghani-Sign: $sig" ${body:+--data "$body"} "http://127.0.0.1:8000$p"; }
          X=$(curl -s -c $J -b $J http://127.0.0.1:8000/wallet | grep -o 'name="csrf-token" content="[^"]*"' | sed 's/.*content="//;s/"//')
          curl -s -o /dev/null -c $J -b $J -X POST -d "_token=$X&method=qi&amount=25000" http://127.0.0.1:8000/pay
          O3=$(php artisan tinker --execute='echo App\Models\PaymentOrder::latest("id")->value("id");' | tail -1)
          c=$(curl -s -o /tmp/out -w '%{http_code}' -c $J -b $J http://127.0.0.1:8000/pay/$O3); echo "$c pay page copy buttons"; grep -q 'نسخ المبلغ' /tmp/out && grep -q 'نسخ الرقم' /tmp/out || fail=1
          c=$(sreq GET /api/v1/payments/console/feed); echo "$c console feed $(head -c 160 /tmp/con)"; [ "$c" = "200" ] && grep -q '"pending"' /tmp/con || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8000/api/v1/payments/console/feed); echo "$c console unsigned"; [ "$c" = "401" ] || fail=1
          c=$(sreq POST /api/v1/payments/console/orders/$O3/approve '{}'); echo "$c console approve"
          R=$(php artisan tinker --execute='echo App\Models\PaymentOrder::find('$O3')->status."|".App\Models\PaymentOrder::find('$O3')->paid_by;' | tail -1); echo "approved: $R"; [ "$R" = "paid|admin" ] || fail=1
          # التقييمات وأسئلة الدروس والرئيسية السريعة
          c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/home); echo "$c api home"; [ "$c" = "200" ] && grep -q '"popular"' /tmp/out || fail=1
          c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8000/api/v1/courses/smart-defense); echo "$c api course"; grep -q '"rating_breakdown"' /tmp/out || fail=1
          c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8000/api/v1/courses/smart-defense/reviews); echo "$c api reviews"; [ "$c" = "200" ] || fail=1
          c=$(curl -s -o /tmp/out -w '%{http_code}' -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $T" -d '{"rating":5}' http://127.0.0.1:8000/api/v1/courses/smart-defense/review); echo "$c api review before 30% $(head -c 120 /tmp/out)"; [ "$c" -ge 400 ] || fail=1
          php artisan tinker --execute='$c=App\Models\Course::where("slug","smart-defense")->first(); $u=App\Models\User::where("role","admin")->first(); App\Models\CourseReview::create(["course_id"=>$c->id,"user_id"=>$u->id,"rating"=>5,"body"=>"كورس عملي ومرتب"]); App\Models\CourseReview::syncRating($c);'
          X=$(curl -s -c $J -b $J http://127.0.0.1:8000/learn/smart-defense/$L | grep -o 'name="csrf-token" content="[^"]*"' | sed 's/.*content="//;s/"//')
          c=$(curl -s -o /dev/null -w '%{http_code}' -c $J -b $J -X POST -d "_token=$X&body=شلون أنصب المختبر على ويندوز؟" http://127.0.0.1:8000/learn/lesson/$L/ask); echo "$c web ask question"; [ "$c" = "302" ] || fail=1
          QID=$(php artisan tinker --execute='echo App\Models\LessonQuestion::latest("id")->value("id");' | tail -1)
          c=$(curl -s -o /tmp/out -w '%{http_code}' -c $J -b $J http://127.0.0.1:8000/teach); echo "$c teach shows question"; grep -q 'شلون أنصب المختبر' /tmp/out || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -c $J -b $J -X POST -d "_token=$X&answer=نزل VirtualBox وكمل الخطوات بالدرس." http://127.0.0.1:8000/teach/questions/$QID); echo "$c answer question"; [ "$c" = "302" ] || fail=1
          c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/lessons/$L/questions); echo "$c api questions $(head -c 160 /tmp/out)"
          c=$(curl -s -o /tmp/out -w '%{http_code}' http://127.0.0.1:8000/course/smart-defense); echo "$c course page with review"; grep -q 'كورس عملي ومرتب' /tmp/out || fail=1
          # «كمل التعلم» للمسجل اللي عنده تقدم بدرس
          php artisan tinker --execute='$u=App\Models\User::where("role","admin")->first(); $l=App\Models\Lesson::first(); App\Models\LessonProgress::updateOrCreate(["user_id"=>$u->id,"lesson_id"=>$l->id],["course_id"=>$l->course_id,"position"=>30]);'
          c=$(curl -s -o /tmp/out -w '%{http_code}' -c $J -b $J http://127.0.0.1:8000/); echo "$c home with continue"; [ "$c" = "200" ] && grep -q 'كمل التعلم' /tmp/out || { fail=1; grep -o 'class="exception-message[^<]*<[^<]*' /tmp/out | head -2; }
          c=$(curl -s -o /tmp/out -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $T" http://127.0.0.1:8000/api/v1/home); echo "$c api home (token)"; [ "$c" = "200" ] || fail=1
          # الصور المصغرة للأغلفة (قرص public = public/storage)
